name: Publish Punk Records Mihon index

on:
  push:
    branches:
      - punk-records-store
    paths:
      - index-publish-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: punk-records-store
          persist-credentials: true
      - name: Write protobuf index
        run: |
          echo '' | base64 --decode | gzip --decompress > index.pb
          test -s index.pb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pb
          if git diff --cached --quiet; then
            echo "Index already up to date; nothing to publish."
            exit 0
          fi
          git commit -m "Publish Punk Records Mihon protobuf index"
          git push origin HEAD:punk-records-store
