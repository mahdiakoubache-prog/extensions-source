name: Build Punk Records APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the Punk Records extension
        required: true
        default: add-punk-records-extension
        type: string
  push:
    branches:
      - punk-records-store

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Kotlin formatting
        run: ./gradlew :src:fr:punkrecords:spotlessApply

      - name: Build Punk Records
        run: ./gradlew :src:fr:punkrecords:assembleRelease :src:fr:punkrecords:lintRelease

      - name: Publish APK to repository branch
        if: github.event_name == 'push'
        run: |
          mkdir -p apk
          cp src/fr/punkrecords/build/outputs/apk/release/tachiyomi-fr.punkrecords-v1.6.2.apk apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/tachiyomi-fr.punkrecords-v1.6.2.apk
          git commit -m "Publish Punk Records v1.6.2 APK" || exit 0
          git push origin HEAD:punk-records-store

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: punk-records-apk
          path: src/fr/punkrecords/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
