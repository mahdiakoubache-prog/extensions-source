name: Build Punk Records APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch containing the Punk Records extension
        required: true
        default: punk-records-store
        type: string
  push:
    branches:
      - punk-records-store
    paths-ignore:
      - repo.json
      - index.min.json
      - index-publish-trigger.txt
      - .github/workflows/build_punk_records.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Configure permanent signing key
        env:
          PUNK_RECORDS_SIGNING_BUNDLE: ${{ secrets.PUNK_RECORDS_SIGNING_BUNDLE }}
        run: |
          if [ -z "$PUNK_RECORDS_SIGNING_BUNDLE" ]; then
            echo "::error::Add the PUNK_RECORDS_SIGNING_BUNDLE repository Actions secret before building."
            exit 1
          fi
          echo "$PUNK_RECORDS_SIGNING_BUNDLE" | base64 --decode > /tmp/punk-records-signing.zip
          mkdir -p /tmp/punk-records-signing
          unzip -q /tmp/punk-records-signing.zip -d /tmp/punk-records-signing
          cp /tmp/punk-records-signing/signingkey.jks signingkey.jks
          set -a
          . /tmp/punk-records-signing/signing.properties
          set +a
          {
            echo "KEY_STORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Kotlin formatting
        run: ./gradlew :src:fr:punkrecords:spotlessApply

      - name: Build Punk Records
        run: ./gradlew :src:fr:punkrecords:assembleRelease :src:fr:punkrecords:lintRelease

      - name: Publish APK to repository branch
        run: |
          mkdir -p apk
          cp src/fr/punkrecords/build/outputs/apk/release/tachiyomi-fr.punkrecords-v1.6.2.apk apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/tachiyomi-fr.punkrecords-v1.6.2.apk
          git commit -m "Publish Punk Records v1.6.2 APK" || exit 0
          git push origin HEAD:punk-records-store

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: punk-records-apk
          path: src/fr/punkrecords/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
